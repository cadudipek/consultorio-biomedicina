name: Gerar instalador (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (ex.: 1.0.0). Deixe vazio para só gerar o arquivo."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Definir versão
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.versao }}"
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          if (-not $v) { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          Set-Content -Encoding utf8 app\versao.py "VERSAO = `"$v`""
          echo "VERSAO=$v" >> $env:GITHUB_ENV

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pytest pyinstaller pywebview

      - name: Rodar testes
        run: python -m pytest tests -q

      - name: Empacotar o aplicativo
        run: >
          pyinstaller --noconfirm --windowed --name Consultorio
          --icon assets/icone.ico
          --add-data "app/templates;app/templates"
          --add-data "app/static;app/static"
          --add-data "schema.sql;."
          --collect-submodules app
          --collect-submodules webview
          --collect-data tzdata
          --collect-data reportlab
          desktop.py

      - name: Verificar que o executável funciona
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$PWD\smoke"
          $env:CONSULTORIO_PORTA = "5099"
          $p = Start-Process dist\Consultorio\Consultorio.exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "O aplicativo fechou sozinho (código $($p.ExitCode))." }
          foreach ($u in "entrar", "") {
            $r = Invoke-WebRequest "http://127.0.0.1:5099/$u" -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "/$u respondeu $($r.StatusCode)" }
          }
          # todas as rotas principais precisam existir (redirecionam para login = 200)
          foreach ($u in "pacientes/", "procedimentos/", "exportacao/") {
            $r = Invoke-WebRequest "http://127.0.0.1:5099/$u" -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "/$u respondeu $($r.StatusCode)" }
          }
          # login de demonstração, PDF e backup precisam funcionar no executável empacotado
          $pg = Invoke-WebRequest "http://127.0.0.1:5099/entrar" -UseBasicParsing -SessionVariable s
          $tok = [regex]::Match($pg.Content, 'name="csrf_token" value="([^"]+)"').Groups[1].Value
          Invoke-WebRequest "http://127.0.0.1:5099/entrar" -Method Post -WebSession $s -UseBasicParsing `
            -Body @{ csrf_token = $tok; email = "demo@exemplo.test"; senha = "demonstracao-123" } | Out-Null
          $pdf = Invoke-WebRequest "http://127.0.0.1:5099/atendimentos/1/pdf" -WebSession $s -UseBasicParsing
          if ($pdf.Headers["Content-Type"] -notlike "application/pdf*") { throw "PDF não foi gerado" }
          $pg = Invoke-WebRequest "http://127.0.0.1:5099/exportacao/" -WebSession $s -UseBasicParsing
          $tok = [regex]::Match($pg.Content, 'name="csrf_token" value="([^"]+)"').Groups[1].Value
          $bk = Invoke-WebRequest "http://127.0.0.1:5099/exportacao/backup" -Method Post -WebSession $s -UseBasicParsing `
            -Body @{ csrf_token = $tok; baixar = "1" }
          if ($bk.RawContentLength -lt 1000) { throw "Backup não foi gerado" }
          Stop-Process -Id $p.Id -Force

          # instalação real (sem demonstração) abre no primeiro acesso
          $env:LOCALAPPDATA = "$PWD\smoke2"
          $p = Start-Process dist\Consultorio\Consultorio.exe -PassThru
          Start-Sleep -Seconds 15
          $r = Invoke-WebRequest "http://127.0.0.1:5099/" -UseBasicParsing
          if ($r.Content -notmatch "Bem-vinda") { throw "Primeiro acesso não apareceu" }
          Stop-Process -Id $p.Id -Force

      - name: Criar o instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSAO" installer\consultorio.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Consultorio-Setup
          path: dist-installer/*.exe

      - name: Publicar na página de Releases
        if: ${{ github.event.inputs.versao != '' || github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSAO" (Get-ChildItem dist-installer\*.exe).FullName `
            --title "Consultório $env:VERSAO" `
            --notes "Instalador para Windows 10 e 11. Baixe **Consultorio-Setup.exe**, abra e siga o assistente. Para atualizar, instale por cima: os dados continuam guardados. Passo a passo: https://cadudipek.github.io/consultorio-biomedicina/"
