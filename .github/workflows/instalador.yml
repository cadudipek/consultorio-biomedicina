name: Gerar instalador (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (ex.: 1.0.0). Deixe vazio para só gerar o arquivo."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Definir versão
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.versao }}"
          if (-not $v -and "${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          if (-not $v) { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          Set-Content -Encoding utf8 app\versao.py "VERSAO = `"$v`""
          echo "VERSAO=$v" >> $env:GITHUB_ENV

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pytest pyinstaller pywebview

      - name: Rodar testes
        run: python -m pytest tests -q

      - name: Empacotar o aplicativo
        run: >
          pyinstaller --noconfirm --windowed --name Consultorio
          --icon assets/icone.ico
          --add-data "app/templates;app/templates"
          --add-data "app/static;app/static"
          --add-data "schema.sql;."
          --collect-submodules app
          --collect-submodules webview
          --collect-data tzdata
          --collect-data reportlab
          desktop.py

      - name: Verificar que o executável funciona
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$PWD\smoke"
          $env:CONSULTORIO_PORTA = "5099"
          $p = Start-Process dist\Consultorio\Consultorio.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "O aplicativo fechou sozinho (código $($p.ExitCode))." }
          $B = "http://127.0.0.1:5099"
          $r = Invoke-WebRequest "$B/" -UseBasicParsing
          if ($r.Content -notmatch "Bem-vinda") { throw "Primeiro acesso não apareceu" }
          function Tok($pg) { [regex]::Match($pg.Content, 'name="csrf_token" value="([^"]+)"').Groups[1].Value }
          # cria o primeiro acesso, entra e percorre o fluxo principal no executável empacotado
          $pg = Invoke-WebRequest "$B/primeiro-acesso" -UseBasicParsing -SessionVariable s
          Invoke-WebRequest "$B/primeiro-acesso" -Method Post -WebSession $s -UseBasicParsing -MaximumRedirection 5 `
            -Body @{ csrf_token = (Tok $pg); nome = "Dra. Teste"; email = "teste@exemplo.com"; senha = "senha-de-teste-123"; conf = "senha-de-teste-123" } | Out-Null
          foreach ($u in "", "pacientes/", "procedimentos/", "modelos/", "biblioteca/", "exportacao/", "configuracoes") {
            $r = Invoke-WebRequest "$B/$u" -WebSession $s -UseBasicParsing
            if ($r.StatusCode -ne 200 -or $r.Content -match "Entre para continuar") { throw "/$u não abriu logada" }
          }
          $pg = Invoke-WebRequest "$B/" -WebSession $s -UseBasicParsing
          Invoke-WebRequest "$B/modelos-iniciais" -Method Post -WebSession $s -UseBasicParsing -Body @{ csrf_token = (Tok $pg) } | Out-Null
          $pg = Invoke-WebRequest "$B/pacientes/novo" -WebSession $s -UseBasicParsing
          $r = Invoke-WebRequest "$B/pacientes/novo" -Method Post -WebSession $s -UseBasicParsing `
            -Body @{ csrf_token = (Tok $pg); nome = "Paciente Teste"; cpf = "11144477735"; telefone = "31999990000" }
          Write-Host "paciente -> $($r.BaseResponse.RequestMessage.RequestUri.AbsolutePath)"
          if ($r.Content -notmatch "Paciente Teste") { throw "Paciente não foi cadastrada" }
          $pg = Invoke-WebRequest "$B/atendimentos/novo?paciente=1&procedimento=1" -WebSession $s -UseBasicParsing
          $r = Invoke-WebRequest "$B/atendimentos/novo" -Method Post -WebSession $s -UseBasicParsing `
            -Body @{ csrf_token = (Tok $pg); paciente = "1"; procedimento = "1"; data_atendimento = "2026-11-10" }
          $dest = $r.BaseResponse.RequestMessage.RequestUri.AbsolutePath
          Write-Host "atendimento -> $dest"
          if ($dest -notmatch "^/atendimentos/(\d+)$") { throw "Atendimento não foi aberto (parou em $dest)" }
          $aid = $Matches[1]
          # preenche a ficha (radio = "Não", texto = "Não") para haver um documento concluído
          $d = Invoke-WebRequest "$B/atendimentos/$aid/documentos/1" -WebSession $s -UseBasicParsing
          $body = @{ csrf_token = (Tok $d) }
          foreach ($m in [regex]::Matches($d.Content, '<input type="radio" name="(campo_\d+)"')) { $body[$m.Groups[1].Value] = "Não" }
          foreach ($m in [regex]::Matches($d.Content, '<textarea[^>]*name="(campo_\d+)"')) { $body[$m.Groups[1].Value] = "Não" }
          $r = Invoke-WebRequest "$B/atendimentos/$aid/documentos/1" -Method Post -WebSession $s -UseBasicParsing -Body $body
          if ($r.Content -notmatch "Integridade verificada") { throw "Ficha não foi salva" }
          $pdf = Invoke-WebRequest "$B/atendimentos/$aid/pdf" -WebSession $s -UseBasicParsing
          if ($pdf.Headers["Content-Type"] -notlike "application/pdf*") { throw "PDF não foi gerado" }
          $pg = Invoke-WebRequest "$B/exportacao/" -WebSession $s -UseBasicParsing
          $bk = Invoke-WebRequest "$B/exportacao/backup" -Method Post -WebSession $s -UseBasicParsing `
            -Body @{ csrf_token = (Tok $pg); baixar = "1" }
          if ($bk.RawContentLength -lt 1000) { throw "Backup não foi gerado" }
          Stop-Process -Id $p.Id -Force

      - name: Criar o instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSAO" installer\consultorio.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Consultorio-Setup
          path: dist-installer/*.exe

      - name: Publicar na página de Releases
        if: ${{ github.event.inputs.versao != '' || github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSAO" (Get-ChildItem dist-installer\*.exe).FullName `
            --title "Consultório $env:VERSAO" `
            --notes "Instalador para Windows 10 e 11. Baixe **Consultorio-Setup.exe**, abra e siga o assistente. Para atualizar, instale por cima: os dados continuam guardados. Passo a passo: https://cadudipek.github.io/consultorio-biomedicina/"
