name: Gerar instalador (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar (ex.: 1.0.0). Deixe vazio para só gerar o arquivo."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pytest pyinstaller pywebview

      - name: Rodar testes
        run: python -m pytest tests -q

      - name: Empacotar o aplicativo
        run: >
          pyinstaller --noconfirm --windowed --name Consultorio
          --icon assets/icone.ico
          --add-data "app/templates;app/templates"
          --add-data "app/static;app/static"
          --add-data "schema.sql;."
          --collect-submodules app
          --collect-submodules webview
          --collect-data tzdata
          --collect-data reportlab
          desktop.py

      - name: Verificar que o executável inicia
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$PWD\smoke"
          $p = Start-Process dist\Consultorio\Consultorio.exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "O aplicativo fechou sozinho (código $($p.ExitCode))." }
          Stop-Process -Id $p.Id -Force

      - name: Criar o instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.event.inputs.versao }}"
          if (-not $v) { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\consultorio.iss
          echo "VERSAO=$v" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Consultorio-Setup
          path: dist-installer/*.exe

      - name: Publicar na página de Releases
        if: ${{ github.event.inputs.versao != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSAO" (Get-ChildItem dist-installer\*.exe).FullName `
            --title "Consultório $env:VERSAO" `
            --notes "Instalador para Windows. Baixe o arquivo Consultorio-Setup, execute e siga o assistente."
