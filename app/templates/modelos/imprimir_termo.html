{% extends "base.html" %}
{% block titulo %}Imprimir termo em branco{% endblock %}
{% block conteudo %}
<div class="nao-imprimir linha-topo" style="margin-bottom:1rem">
  <a class="btn sec" href="/modelos/">← Voltar</a>
  <button class="btn" onclick="window.print()">Imprimir</button>
</div>
<div class="folha">
  <h1>{{ termo.titulo }}</h1>
  <div class="cab">
    <div><div class="linha-em-branco"></div><div class="rot">Nome da paciente</div></div>
    <div><div class="linha-em-branco"></div><div class="rot">CPF</div></div>
  </div>
  <div class="termo-texto">{{ versao.conteudo }}</div>
  <div class="assin-em-branco">
    <div><div class="linha-em-branco"></div><div class="rot">Assinatura da paciente</div></div>
    <div><div class="linha-em-branco"></div><div class="rot">Data</div></div>
  </div>
  <div class="rot" style="margin-top:1rem">Termo: {{ termo.titulo }} · versão {{ versao.numero }}</div>
</div>
{% endblock %}
